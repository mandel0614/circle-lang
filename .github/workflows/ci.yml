name: Circle validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Run regression tests
        shell: python
        run: |
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          print(result.stdout, end="", flush=True)
          if result.returncode:
              tail = result.stdout[-8000:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Regression test failure::{escaped}", flush=True)
          sys.exit(result.returncode)
      - run: circle verify examples/00_hello_cell.circle --config examples/00_signals.json -o runs/hello.json
      - run: python -m pip wheel --no-deps . -w dist
